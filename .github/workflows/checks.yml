name: checks
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python live-transcribe/scripts/live_transcribe.py --help
      - run: python -c "import faster_whisper, av; import sys; sys.path.insert(0, 'live-transcribe/scripts'); from audio_backend import AudioBackend"
